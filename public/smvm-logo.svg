<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="100%" height="100%">
  <defs>
    <!-- Royal electric blue matching original emblem -->
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0035ef" />
      <stop offset="100%" stop-color="#0022d6" />
    </linearGradient>

    <!-- Deep shadow blue for right-hand dimension/facets -->
    <linearGradient id="shadeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001488" />
      <stop offset="100%" stop-color="#000e62" />
    </linearGradient>

    <clipPath id="logoClip">
      <rect width="820" height="540" />
    </clipPath>
  </defs>

  <g clip-path="url(#logoClip)">
    <!-- 1. The Large Stylized 'S' (Salomão) -->
