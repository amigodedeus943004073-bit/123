    <!-- 4. The Capital Sans-Serif 'V' (Vinene - centered below the mm) -->
    <path 
      d="M 525 372
         L 556 372
         L 582 458
         L 602 458
         L 630 372
         L 660 372
         L 614 485
         L 568 485 Z"
