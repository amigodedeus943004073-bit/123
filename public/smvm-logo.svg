         C 652 122 690 120 722 145
         C 750 168 755 205 750 258
         C 745 280 735 292 720 292
         C 705 292 698 275 700 255
         C 705 210 702 172 690 158
         C 682 148 668 148 658 158
         C 648 172 648 210 644 265
